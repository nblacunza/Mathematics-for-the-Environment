<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part I - Mathematical Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

    :root {
      --springer-yellow: #FFC300;
      --paper: #f7f7f7;
      --ink: #111827;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,195,0,0.10), transparent 20%),
        var(--paper);
      color: var(--ink);
    }

    .springer-yellow { background-color: var(--springer-yellow); }
    .text-springer-yellow { color: var(--springer-yellow); }

    .road-wrapper {
      position: relative;
      min-height: 2300px;
      border-radius: 2rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.75));
      border: 1px solid rgba(17,24,39,0.06);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(17,24,39,0.08);
    }

    .road {
      position: relative;
      width: 100%;
      min-height: 2300px;
      padding: 2rem 1rem;
    }

    .road-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .road-path-base {
      fill: none;
      stroke: rgba(17,24,39,0.10);
      stroke-width: 56;
      stroke-linecap: round;
    }

    .road-path-line {
      fill: none;
      stroke: var(--springer-yellow);
      stroke-width: 28;
      stroke-linecap: round;
      filter: drop-shadow(0 14px 18px rgba(255,195,0,0.20));
    }

    .road-path-center {
      fill: none;
      stroke: rgba(255,255,255,0.70);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 10 14;
    }

    .milestone {
      position: absolute;
      width: 230px;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .milestone-card {
      position: relative;
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 1.5rem;
      padding: 0.8rem 0.9rem 0.8rem 4.2rem;
      box-shadow: 0 10px 35px rgba(17,24,39,0.07);
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .milestone:hover .milestone-card,
    .milestone.active .milestone-card,
    .milestone:focus-within .milestone-card {
      transform: translateY(-4px);
      box-shadow: 0 24px 60px rgba(17,24,39,0.14);
      border-color: rgba(255,195,0,0.55);
    }

    .marker {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd34d, var(--springer-yellow));
      border: 3px solid white;
      box-shadow: 0 10px 25px rgba(255,195,0,0.35);
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 900;
      color: #111827;
      cursor: pointer;
    }

    .tooltip {
      margin-top: 0.75rem;
      background: rgba(17,24,39,0.96);
      color: white;
      border-radius: 1rem;
      padding: 0.9rem 1rem;
      font-size: 0.8rem;
      line-height: 1.5;
      box-shadow: 0 18px 45px rgba(17,24,39,0.22);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .milestone:hover .tooltip,
    .milestone.active .tooltip,
    .milestone:focus-within .tooltip {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .chapter-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111827;
    }

    .chapter-link span:last-child {
      transition: transform 220ms ease;
    }

    .milestone:hover .chapter-link span:last-child,
    .milestone.active .chapter-link span:last-child,
    .milestone:focus-within .chapter-link span:last-child {
      transform: translateX(3px);
    }

    @media (max-width: 768px) {
      .road-wrapper {
        min-height: auto;
        padding: 0;
      }

      .road {
        min-height: auto;
        padding: 1.5rem 1rem 2rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .road-svg {
        display: none;
      }

      .road::before {
        content: "";
        position: absolute;
        left: 2rem;
        top: 1.5rem;
        bottom: 1.5rem;
        width: 6px;
        border-radius: 999px;
        background: linear-gradient(to bottom, #ffd34d, var(--springer-yellow));
        opacity: 0.95;
      }

      .milestone {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        width: 100%;
        max-width: none;
        padding-left: 3.25rem;
      }

      .milestone-card {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 3.9rem;
        border-radius: 1.25rem;
      }

      .marker {
        left: -2.2rem;
        top: 1.2rem;
        transform: none;
        width: 2.5rem;
        height: 2.5rem;
        font-size: 0.7rem;
      }

      .tooltip {
        opacity: 1;
        transform: none;
        pointer-events: auto;
        margin-top: 0.6rem;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-black/5">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-extrabold text-gray-900 tracking-tight">
        Mathematics for the <span class="text-springer-yellow">Environment</span>
      </a>
      <nav class="flex items-center space-x-6">
        <a href="contents.html" class="text-sm font-bold text-gray-500 hover:text-gray-900 transition uppercase tracking-widest">
          Contents
        </a>
        <a href="index.html" class="text-sm font-bold text-gray-500 hover:text-gray-900 transition uppercase tracking-widest">
          Home
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-16 flex-grow w-full">
    <section class="mb-10">
      <p class="text-xs font-black uppercase tracking-[0.28em] text-gray-500 mb-4">Part I</p>
      <h1 class="text-5xl font-black uppercase tracking-tighter text-gray-900">
        Mathematical <span class="text-springer-yellow">Tools</span>
      </h1>
      <div class="h-1.5 w-28 springer-yellow mt-4"></div>
      <p class="mt-6 max-w-3xl text-gray-600 leading-relaxed">
        The theoretical journey through numerical analysis, topology, linear algebra, ODEs, and topological dynamics.
      </p>
    </section>

    <section class="road-wrapper">
      <div class="road" id="road">
        <svg class="road-svg" viewBox="0 0 1200 2400" preserveAspectRatio="none" aria-hidden="true">
          <path
            id="book-road"
            class="road-path-base"
            d="M 180 130
               C 390 90, 650 150, 880 280
               C 1040 370, 1050 620, 870 760
               C 700 890, 390 870, 230 990
               C 120 1075, 150 1280, 340 1380
               C 520 1470, 800 1430, 950 1540
               C 1080 1635, 1040 1845, 840 1960
               C 650 2070, 370 2050, 250 2170
               C 190 2230, 250 2310, 430 2340" />
          <path
            class="road-path-line"
            d="M 180 130
               C 390 90, 650 150, 880 280
               C 1040 370, 1050 620, 870 760
               C 700 890, 390 870, 230 990
               C 120 1075, 150 1280, 340 1380
               C 520 1470, 800 1430, 950 1540
               C 1080 1635, 1040 1845, 840 1960
               C 650 2070, 370 2050, 250 2170
               C 190 2230, 250 2310, 430 2340" />
          <path
            class="road-path-center"
            d="M 180 130
               C 390 90, 650 150, 880 280
               C 1040 370, 1050 620, 870 760
               C 700 890, 390 870, 230 990
               C 120 1075, 150 1280, 340 1380
               C 520 1470, 800 1430, 950 1540
               C 1080 1635, 1040 1845, 840 1960
               C 650 2070, 370 2050, 250 2170
               C 190 2230, 250 2310, 430 2340" />
        </svg>
      </div>
    </section>
  </main>

  <footer class="springer-yellow py-10 text-center text-gray-800 text-sm font-medium mt-16">
    <p>&copy; 2026 Mathematics for the Environment | Published by Springer</p>
  </footer>

  <script>
    const chapters = [
      {
        n: 1,
        title: "Solving nonlinear equations",
        desc: "Dichotomy, secant, and Newton methods for solving nonlinear equations in one and several variables.",
        href: "chapter1.html",
        side: -1
      },
      {
        n: 2,
        title: "Elementary topology",
        desc: "Open and closed sets, compactness, continuity, and the geometric language underlying analysis.",
        side: 1
      },
      {
        n: 3,
        title: "Linear algebra and applications",
        desc: "Vectors, matrices, norms, eigendirections, and their practical meaning in scientific modelling.",
        side: 1
      },
      {
        n: 4,
        title: "Solving linear systems Ax = b",
        desc: "Direct and iterative methods, conditioning, and computational strategies for linear systems.",
        side: 1
      },
      {
        n: 5,
        title: "Computing eigenvalues and eigenvectors",
        desc: "Spectral methods, dominant modes, and the geometry of linear operators.",
        side: -1
      },
      {
        n: 6,
        title: "Interpolation and approximation",
        desc: "Constructing continuous descriptions from data, with approximation error and practical interpolation schemes.",
        side: -1
      },
      {
        n: 7,
        title: "Numerical integration methods",
        desc: "Quadrature rules and numerical estimates of integrals, fluxes, and accumulated quantities.",
        side: -1
      },
      {
        n: 8,
        title: "Introduction to ODEs",
        desc: "Flows, trajectories, and the interpretation of differential equations as models of time evolution.",
        side: 1
      },
      {
        n: 9,
        title: "Linear autonomous systems",
        desc: "Equilibria, invariant directions, stability, and phase portraits near fixed points.",
        side: 1
      },
      {
        n: 10,
        title: "Numerically solving ODEs",
        desc: "Euler and Runge–Kutta methods, accuracy, stability, and interpretation of numerical trajectories.",
        side: 1
      },
      {
        n: 11,
        title: "Elements of topological dynamics",
        desc: "Invariant sets, recurrence, attractors, and the topological understanding of long-term dynamics.",
        side: -1
      }
    ];

    const road = document.getElementById("road");
    const path = document.getElementById("book-road");

    function makeMilestone(ch) {
      const article = document.createElement("article");
      article.className = "milestone";

      const linkHTML = ch.href
        ? `<a href="${ch.href}" class="chapter-link">Open chapter <span>→</span></a>`
        : "";

      article.innerHTML = `
        <div class="milestone-card">
          <button class="marker" aria-label="Chapter ${ch.n}">${ch.n}</button>
          <span class="text-[10px] font-black text-springer-yellow uppercase tracking-[0.22em]">Chapter ${ch.n}</span>
          <h3 class="mt-1 text-lg font-black text-gray-900">${ch.title}</h3>
          ${linkHTML}
        </div>
        <div class="tooltip">${ch.desc}</div>
      `;
      return article;
    }

    function positionMilestones() {
      if (window.innerWidth <= 768) return;

      road.querySelectorAll(".milestone").forEach(el => el.remove());

      const total = path.getTotalLength();
      const n = chapters.length;

      const startMargin = 0.06;
      const endMargin = 0.06;
      const usable = 1 - startMargin - endMargin;

      chapters.forEach((ch, i) => {
        const t = startMargin + (i / (n - 1)) * usable;
        const s = t * total;

        const p = path.getPointAtLength(s);
        const pPrev = path.getPointAtLength(Math.max(0, s - 1));
        const pNext = path.getPointAtLength(Math.min(total, s + 1));

        const tx = pNext.x - pPrev.x;
        const ty = pNext.y - pPrev.y;
        const norm = Math.hypot(tx, ty) || 1;

        const nx = -ty / norm;
        const ny = tx / norm;

        const offset = 120;
        const x = p.x + ch.side * offset * nx;
        const y = p.y + ch.side * offset * ny;

        const article = makeMilestone(ch);
        article.style.left = `${(x / 1200) * 100}%`;
        article.style.top = `${(y / 2400) * 100}%`;

        road.appendChild(article);
      });

      attachInteractions();
    }

    function attachInteractions() {
      const milestones = document.querySelectorAll(".milestone");

      milestones.forEach((item) => {
        const marker = item.querySelector(".marker");
        marker.addEventListener("click", (event) => {
          event.preventDefault();
          const isActive = item.classList.contains("active");
          milestones.forEach((m) => m.classList.remove("active"));
          if (!isActive) item.classList.add("active");
        });
      });

      document.addEventListener("click", (event) => {
        const clickedMilestone = event.target.closest(".milestone");
        if (!clickedMilestone) {
          document.querySelectorAll(".milestone").forEach((m) => m.classList.remove("active"));
        }
      });
    }

    function renderMobileStack() {
      if (window.innerWidth > 768) return;
      road.querySelectorAll(".milestone").forEach(el => el.remove());

      chapters.forEach((ch) => {
        const article = makeMilestone(ch);
        road.appendChild(article);
      });

      attachInteractions();
    }

    function render() {
      road.querySelectorAll(".milestone").forEach(el => el.remove());
      if (window.innerWidth <= 768) {
        renderMobileStack();
      } else {
        positionMilestones();
      }
    }

    window.addEventListener("load", render);
    window.addEventListener("resize", render);
  </script>
</body>
</html>
